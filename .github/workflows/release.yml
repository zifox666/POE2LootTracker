name: Build and publish Windows release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.3
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Verify release version
        shell: pwsh
        run: |
          dart run tool/version.dart --check
          dart run tool/version.dart --expect-tag $env:GITHUB_REF_NAME

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Run tracker host tests
        run: dotnet test tracker_host_tests/TrackerHost.Tests.csproj -c Release

      - name: Build Windows application
        run: flutter build windows --release

      - name: Package release and checksum
        id: package
        shell: pwsh
        run: |
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE 'build\windows\x64\runner\Release'
          if (-not (Test-Path -LiteralPath (Join-Path $releaseDirectory 'poe2_loot_tracker.exe'))) {
            throw "Windows release output was not found at $releaseDirectory"
          }

          $assetName = "POE2LootTracker-$env:GITHUB_REF_NAME-windows-x64.zip"
          $assetPath = Join-Path $env:RUNNER_TEMP $assetName
          Compress-Archive -Path (Join-Path $releaseDirectory '*') -DestinationPath $assetPath -CompressionLevel Optimal

          $checksumPath = "$assetPath.sha256"
          $hash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $assetName" | Set-Content -LiteralPath $checksumPath -Encoding ascii

          "asset_path=$assetPath" >> $env:GITHUB_OUTPUT
          "checksum_path=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.package.outputs.asset_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME $env:ASSET_PATH $env:CHECKSUM_PATH --verify-tag --generate-notes --title $env:GITHUB_REF_NAME
