name: Build and publish Windows release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.3
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Verify release version
        shell: pwsh
        run: |
          dart run tool/version.dart --check
          dart run tool/version.dart --expect-tag $env:GITHUB_REF_NAME

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Run tracker host tests
        run: dotnet test tracker_host_tests/TrackerHost.Tests.csproj -c Release

      - name: Build Windows application
        run: flutter build windows --release

      - name: Package installer, portable edition, and checksums
        id: package
        shell: pwsh
        run: |
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE 'build\windows\x64\runner\Release'
          if (-not (Test-Path -LiteralPath (Join-Path $releaseDirectory 'poe2_loot_tracker.exe'))) {
            throw "Windows release output was not found at $releaseDirectory"
          }

          $portableName = "POE2LootTracker-$env:GITHUB_REF_NAME-windows-x64-portable.zip"
          $portablePath = Join-Path $env:RUNNER_TEMP $portableName
          Compress-Archive -Path (Join-Path $releaseDirectory '*') -DestinationPath $portablePath -CompressionLevel Optimal

          $env:POE2_APP_VERSION = $env:GITHUB_REF_NAME.TrimStart('v')
          $env:POE2_RELEASE_DIRECTORY = $releaseDirectory
          $env:POE2_INSTALLER_OUTPUT = $env:RUNNER_TEMP
          $env:POE2_INSTALLER_BASENAME = "POE2LootTracker-$env:GITHUB_REF_NAME-windows-x64-setup"
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler was not found at $iscc"
          }
          & $iscc (Join-Path $env:GITHUB_WORKSPACE 'packaging\windows\installer.iss')
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

          $setupPath = Join-Path $env:RUNNER_TEMP "$env:POE2_INSTALLER_BASENAME.exe"
          if (-not (Test-Path -LiteralPath $setupPath)) {
            throw "Windows installer was not found at $setupPath"
          }

          $portableChecksumPath = "$portablePath.sha256"
          $portableHash = (Get-FileHash -LiteralPath $portablePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$portableHash  $portableName" | Set-Content -LiteralPath $portableChecksumPath -Encoding ascii

          $setupChecksumPath = "$setupPath.sha256"
          $setupHash = (Get-FileHash -LiteralPath $setupPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$setupHash  $([IO.Path]::GetFileName($setupPath))" | Set-Content -LiteralPath $setupChecksumPath -Encoding ascii

          "portable_path=$portablePath" >> $env:GITHUB_OUTPUT
          "portable_checksum_path=$portableChecksumPath" >> $env:GITHUB_OUTPUT
          "setup_path=$setupPath" >> $env:GITHUB_OUTPUT
          "setup_checksum_path=$setupChecksumPath" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PORTABLE_PATH: ${{ steps.package.outputs.portable_path }}
          PORTABLE_CHECKSUM_PATH: ${{ steps.package.outputs.portable_checksum_path }}
          SETUP_PATH: ${{ steps.package.outputs.setup_path }}
          SETUP_CHECKSUM_PATH: ${{ steps.package.outputs.setup_checksum_path }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME $env:SETUP_PATH $env:SETUP_CHECKSUM_PATH $env:PORTABLE_PATH $env:PORTABLE_CHECKSUM_PATH --verify-tag --generate-notes --title $env:GITHUB_REF_NAME
